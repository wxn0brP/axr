<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>AXR Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>

<body>
    <section id="login" class="login hidden">
        <form id="login-form" class="card">
            <h1>AXR Panel</h1>
            <p class="muted">Enter AXR_TOKEN to save it in this browser cookie.</p>
            <label>
                AXR_TOKEN
                <input name="token" type="password" autocomplete="current-password" required autofocus>
            </label>
            <div class="actions">
                <button class="primary" type="submit">Log in</button>
            </div>
            <p id="login-error" class="error"></p>
        </form>
    </section>

    <section id="app" class="shell hidden">
        <aside>
            <div class="top">
                <h1>AXR Panel</h1>
                <button id="logout" class="danger" type="button">Log out</button>
            </div>
            <p class="muted">Adapters registered by plugins.</p>
            <div id="adapter-list" class="adapter-list"></div>
        </aside>
        <main>
            <div id="content" class="content"></div>
        </main>
    </section>
</body>

</html>
